android {
   // NOTE: do not force compileSdkVersion here - MABS/cordova sets the
   // appropriate version (34/35 on MABS 10/11). Forcing it to 30 breaks
   // modern AGP builds.
  defaultConfig {
    multiDexEnabled true
  }
  compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

buildscript {
  repositories {
    google()
     mavenCentral()
  }
  dependencies {
    // Only the google-services classpath is safe to declare here.
    // The AGP classpaths (4.1.0 / 3.5.2) and the Fabric-era crashlytics plugin
    // were removed: they conflict with the AGP 8.x / Gradle 8 used by MABS 11+.
    classpath 'com.google.gms:google-services:4.4.2'
  }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task cleanMyProject(type: Delete) {
  delete rootProject.buildDir
}

repositories {
  google()
  mavenCentral()
  maven {
    url "https://maven.google.com"
  }
}

dependencies {
  implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
  implementation 'com.google.firebase:firebase-auth:22.3.1'
  // firebase-core removed: deprecated alias of firebase-analytics, which is
  // already declared in plugin.xml (com.google.firebase:firebase-analytics:21.5.1).
  // Fabric Crashlytics artifact removed: it is not on Maven Central anymore and
  // FirebasePlugin.java no longer references it.
}

cdvPluginPostBuildExtras.add({
  apply plugin: 'com.google.gms.google-services'
})

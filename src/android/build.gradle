// MABS 12+ (Gradle 8 / AGP 8 / Java 17):
// - Do NOT declare the Android Gradle Plugin classpath here (MABS owns it).
// - Do NOT override compileSdkVersion (MABS sets it, e.g. 34/35).
// - The com.google.gms.google-services Gradle plugin is NOT applied here because:
//   * In MABS 11: It would be added by the main project or another Firebase plugin
//   * In MABS 12: Plugins cannot reliably add Gradle plugins via buildscript
//   * The google-services.json file is still processed if the plugin is applied elsewhere
//   * If you need the Google Services Gradle plugin, add it via another plugin or 
//     ensure cordova-plugin-google-signin is included in your project

android {
    defaultConfig {
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.0.3'
}

// OPTIONAL hardening: if ANOTHER plugin in the app pulls a Firebase Android artifact
// newer than these pins (built with Kotlin 2.1 metadata), MABS 12.1's Kotlin 1.9
// compiler fails with "metadata is 2.1.0, expected version is 1.9.0".
// Uncomment to force the whole app back to the Kotlin-1.9-compatible set:
// configurations.all {
//   resolutionStrategy {
//     force 'com.google.firebase:firebase-analytics:22.0.2'
//     force 'com.google.firebase:firebase-messaging:24.0.3'
//     force 'com.google.firebase:firebase-config:22.0.1'
//     force 'com.google.firebase:firebase-perf:21.0.4'
//     force 'com.google.firebase:firebase-crashlytics:19.0.3'
//     force 'com.google.firebase:firebase-auth:23.0.0'
//     force 'com.google.firebase:firebase-dynamic-links:22.1.0'
//   }
// }

// NOTE: The com.google.gms.google-services Gradle plugin application has been removed.
// This plugin is responsible for processing google-services.json and generating resources.
// It must be applied by one of these methods:
// 1. Include cordova-plugin-google-signin in your project (it adds this plugin)
// 2. Add it to your app's build.gradle manually
// 3. For MABS 11, the main project's build.gradle may already include it
//
// The google-services.json file is still deployed by this plugin and will be used
// by Firebase SDKs at runtime even without the Gradle plugin (though some build-time
// code generation features won't work).
